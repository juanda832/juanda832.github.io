<text x="140" y="208" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#718071">INDEPENDENT REACT CONCEPT</text><text x="140" y="278" font-family="Georgia,serif" font-size="53" fill="#18251e">Make the first brief</text><text x="140" y="339" font-family="Georgia,serif" font-size="53" font-style="italic" fill="#66826a">feel clear.</text><text x="140" y="386" font-family="Arial,sans-serif" font-size="19" fill="#68736a">Shape a few project essentials and see a clean</text><text x="140" y="414" font-family="Arial,sans-serif" font-size="19" fill="#68736a">summary update as you go.</text>
<rect x="130" y="466" width="670" height="294" rx="18" fill="#fff" stroke="#e5e8df"/><text x="166" y="511" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#718071">YOUR PROJECT</text><text x="166" y="550" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202b24">Business or project name</text><rect x="166" y="567" width="598" height="49" rx="9" fill="#fbfbf8" stroke="#dfe4da"/><text x="184" y="598" font-family="Arial,sans-serif" font-size="16" fill="#5c665e">Andes Studio</text><text x="166" y="655" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202b24">What do you need?</text><rect x="166" y="672" width="176" height="50" rx="9" fill="#e6eee5" stroke="#aebcab"/><text x="254" y="703" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#33473a">Landing page ✓</text><rect x="356" y="672" width="176" height="50" rx="9" fill="#fbfbf8" stroke="#dfe4da"/><text x="444" y="703" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#58635a">Business site</text><rect x="546" y="672" width="218" height="50" rx="9" fill="#fbfbf8" stroke="#dfe4da"/><text x="655" y="703" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#58635a">Online portfolio</text>
<rect x="840" y="203" width="446" height="557" rx="18" fill="url(#panel)"/><text x="880" y="251" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#b8c9b5">LIVE PREVIEW · DRAFT</text><text x="880" y="303" font-family="Georgia,serif" font-size="34" fill="#fff">A useful first brief.</text><text x="880" y="341" font-family="Arial,sans-serif" font-size="16" fill="#cad4cb">A clear starting point for the next</text><text x="880" y="366" font-family="Arial,sans-serif" font-size="16" fill="#cad4cb">design and development conversation.</text><path d="M880 396h366" stroke="#53675a"/><text x="880" y="438" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#b8c9b5">PROJECT SUMMARY</text><text x="880" y="478" font-family="Arial,sans-serif" font-size="17" fill="#fff">Andes Studio needs a landing page</text><text x="880" y="505" font-family="Arial,sans-serif" font-size="17" fill="#fff">with a clear inquiry action.</text><rect x="880" y="557" width="105" height="42" rx="21" fill="#f0f3e9"/><text x="932" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#28392e">Copy brief</text><text x="1003" y="584" font-family="Arial,sans-serif" font-size="14" fill="#d2ddd2">Nothing is sent or saved to a server.</text><text x="140" y="793" font-family="Arial,sans-serif" font-size="13" letter-spacing="1" fill="#778278">REACT · RESPONSIVE UI · LOCAL STATE · NO BACKEND</text>
</svg>
