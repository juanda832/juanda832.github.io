<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Website Brief Builder React concept preview</title>
<desc id="desc">A warm, minimal website brief planner with a form on the left and a live summary card on the right.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1efe9"/><stop offset="1" stop-color="#e4e9df"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2b23"/><stop offset="1" stop-color="#2e4437"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#25372d" flood-opacity=".15"/></filter></defs>
<rect width="1440" height="900" fill="url(#bg)"/><circle cx="1290" cy="120" r="260" fill="#f7f1df" opacity=".82"/><circle cx="100" cy="800" r="250" fill="#e7eadf" opacity=".8"/>
<rect x="80" y="72" width="1280" height="756" rx="28" fill="#fbfaf7" filter="url(#shadow)"/>
